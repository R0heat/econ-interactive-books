<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teaching Resources - Interactive Courses</title><style>html,body{margin:0;height:100%;font-family:Georgia,serif;background:#fff}.w{display:flex;flex-direction:column;height:100%}.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px 8px}button{font:600 15px Georgia,serif;padding:10px 18px;border:2px solid #00539f;background:#fff;color:#00539f;border-radius:8px;cursor:pointer}button:hover{background:#e6eef7}button.on{background:#00539f;color:#fff}iframe{flex:1;border:0;width:100%;display:none}.msg{flex:1;display:flex;align-items:center;justify-content:center;color:#555;font-size:16px;text-align:center;padding:20px}</style></head><body><div class="w"><div class="bar"><button id="b1" onclick="go(1)">Introduction to Macroeconomics</button><button id="b2" onclick="go(2)">Microeconomics</button><button id="b3" onclick="go(3)">Money and Banking</button></div><div class="msg" id="m">Click a course above to open it.</div><iframe id="f" title="Course"></iframe></div><script>var u={1:"macroeconomics.html",2:"microeconomics.html",3:"money-and-banking.html"};function go(n){for(var i=1;i<=3;i++){document.getElementById("b"+i).className=(i==n)?"on":""}document.getElementById("m").style.display="none";var f=document.getElementById("f");f.style.display="block";f.src=u[n]}</script></body></html>
